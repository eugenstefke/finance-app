{% extends "base.html" %}
{% block title %}Passwort ändern · Finanzen{% endblock %}

{% block content %}
<section class="karte login">
  <h1>Passwort ändern</h1>
  <form method="post" class="formular senkrecht">
    {{ csrf_field() }}
    <input type="text" name="benutzername" value="{{ g.user.benutzername }}" autocomplete="username" hidden>
    <label class="feld">Bisheriges Passwort
      <input type="password" name="alt" autocomplete="current-password" required>
    </label>
    <label class="feld">Neues Passwort (mind. {{ min_length }} Zeichen)
      <input type="password" name="neu" autocomplete="new-password" minlength="{{ min_length }}" required>
    </label>
    <label class="feld">Neues Passwort wiederholen
      <input type="password" name="neu2" autocomplete="new-password" minlength="{{ min_length }}" required>
    </label>
    <button type="submit" class="btn primaer">Speichern</button>
  </form>
  <p class="gedimmt klein">Nach der Änderung werden alle anderen Geräte abgemeldet.</p>
</section>
{% endblock %}
